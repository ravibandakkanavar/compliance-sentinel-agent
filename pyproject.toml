[project]
name = "compliance-sentinel"
version = "0.1.0"
description = "LangGraph agent that scrapes regulatory sites, audits a codebase against new rules, and produces an audit-ready PDF report."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "playwright>=1.47",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "bullmq>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["report/templates/*", "migrations/*.sql", "fixtures/*", "sources.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["postgres: needs a running Postgres with pgvector (set TEST_DATABASE_URL)"]
filterwarnings = ["ignore::bs4.XMLParsedAsHTMLWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["demo_repo", "data", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
