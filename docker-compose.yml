x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    SENTINEL_DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
    SENTINEL_REDIS_URL: redis://redis:6379
  volumes:
    - ./data:/data

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["sentinel", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["sentinel", "worker", "--cron", "0 6 * * *"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "sentinel.api:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
