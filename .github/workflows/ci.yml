name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v
        env:
          TEST_DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t compliance-sentinel .
      - name: PDF rendering, browser and embedding model work inside the image
        run: |
          docker run --rm compliance-sentinel python -c "
          from weasyprint import HTML
          from playwright.sync_api import sync_playwright
          from fastembed import TextEmbedding

          pdf = HTML(string='<h1>Compliance audit report</h1>').write_pdf()
          assert pdf[:4] == b'%PDF', 'WeasyPrint did not produce a PDF'

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.set_content('<p>ok</p>')
              assert page.inner_text('p') == 'ok'
              browser.close()

          vector = next(iter(TextEmbedding(model_name='BAAI/bge-small-en-v1.5').embed(['erasure'])))
          assert len(vector) == 384, len(vector)
          print('image smoke test passed')
          "
